[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cinedata-analytics"
version = "0.1.0"
description = "Agente Text-to-SQL para o catálogo CineData Analytics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1,<2",
    "langchain-openrouter>=0.1,<1",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["ruff>=0.11,<1"]

[project.scripts]
cinedata = "cinedata.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
